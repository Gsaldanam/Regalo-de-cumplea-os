<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b1226">
  <meta name="description" content="Un pequeño viaje de cumpleaños hecho con cariño.">
  <title>Feliz cumpleaños, Kayra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <main>
    <section class="hero" id="inicio" aria-labelledby="heroTitle">
      <div class="hero__glow hero__glow--one"></div>
      <div class="hero__glow hero__glow--two"></div>
      <div class="hero__postcards" aria-label="Postales de nuestros recuerdos">
        <figure class="postcard postcard--photo">
          <button class="postcard__button" id="photoButton" type="button" aria-label="Ver foto de Kayra y yo en grande">
            <div class="postcard__frame">
              <img src="assets/foto-recuerdo.webp" alt="Kayra y yo juntos" />
            </div>
          </button>
        </figure>
        <figure class="postcard postcard--empty" tabindex="0" role="button" aria-label="Foto pendiente: Esa foto la llenamos pronto">
          <div class="postcard__frame" aria-hidden="true"></div>
          <figcaption>Nos faltan fotos juntos</figcaption>
        </figure>
      </div>
      <h1 id="heroTitle">¡Feliz cumpleaños, <span>Kayra</span><b class="hero-title__exclamation">!</b></h1>
      <p class="hero__intro">Espero te guste este pequeño detalle, un paseito al pasado un pelin nostalgico.</p>
      <button class="button button--primary" id="startButton" type="button">
        Empezar el paseo <span aria-hidden="true">↓</span>
      </button>
      <p class="hero__hint">Hecho especialmente para la mujer más increible que he conocido.</p>
    </section>

    <section class="journey" id="sobres" aria-label="Camino de cartas">
      <div class="journey-map" id="journeyMap">
        <svg class="path-line" viewBox="0 0 1000 1280" preserveAspectRatio="none" aria-hidden="true">
          <path class="path-line__base" d="M250 100 C750 100 750 310 250 310 S250 520 750 520 S750 730 250 730 S250 940 750 940 S750 1150 500 1150"></path>
          <path class="path-line__progress" id="pathProgress" d="M250 100 C750 100 750 310 250 310 S250 520 750 520 S750 730 250 730 S250 940 750 940 S750 1150 500 1150"></path>
        </svg>
        <div class="envelopes" id="envelopes" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <dialog class="letter-dialog" id="letterDialog" aria-labelledby="letterTitle">
    <img class="letter-face letter-face--chris" src="assets/chris-evans.webp" alt="Chris Evans" hidden>
    <img class="letter-face letter-face--gavi" src="assets/gavi.webp" alt="Gavi" hidden>
    <button class="letter-postcard-button" id="letterPostcardButton" type="button" aria-label="Ver la casita del terror ampliada" hidden>
      <img class="letter-postcard" id="letterPostcard" src="assets/casita del terror.jpg" alt="La casita del terror">
    </button>
    <div class="letter-dialog__paper">
      <button class="icon-button letter-dialog__close" id="closeLetter" type="button" aria-label="Cerrar carta">×</button>
      <div class="letter-dialog__topline"><span id="letterDate"></span><span id="letterNumber"></span></div>
      <h2 id="letterTitle"></h2>
      <div class="letter-dialog__content" id="letterContent"></div>
    </div>
    <div class="screamer" id="screamer" role="button" tabindex="0" aria-label="Cerrar susto" aria-hidden="true">
      <div class="screamer__flash"></div>
      <div class="screamer__face">¡BU!</div>
      <p>La casita del terror todavía tenía una sorpresa.</p>
    </div>
  </dialog>

  <dialog class="photo-dialog" id="photoDialog" aria-label="Foto ampliada">
    <button class="icon-button photo-dialog__close" id="closePhoto" type="button" aria-label="Cerrar foto">×</button>
    <img id="photoImage" src="assets/foto-recuerdo.webp" alt="Kayra y yo juntos" />
  </dialog>

  <dialog class="final-dialog" id="finalDialog" aria-labelledby="finalTitle">
    <div class="final-dialog__content">
      <p class="eyebrow">Fin del recorrido</p>
      <h2 id="finalTitle">Y esto apenas comienza</h2>
      <p id="finalMessage"></p>
      <button class="button button--primary" id="saveMoment" type="button" aria-label="Guardar este momento">Guardar este momento ✨</button>
      <button class="text-button" id="closeFinal" type="button" aria-label="Volver al camino">Volver al camino</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/main.js?v=5"></script>
</body>
 </html>
